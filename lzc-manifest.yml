application:
  subdomain: dumb-assets
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://dumb-assets:3000/
services:
  dumb-assets:
    # upstream: dumbwareio/dumbassets:1.0.11
    image: dumbwareio/dumbassets:1.0.11
    environment:
      - NODE_ENV=production
      - DEBUG=true
      - SITE_TITLE=DumbAssets
      - BASE_URL=https://${LAZYCAT_APP_DOMAIN}
      - DUMBASSETS_PIN={{ stable_secret "dumbassets_pin" }}
      - ALLOWED_ORIGINS=*
      - APPRISE_URL=
    binds:
      - /lzcapp/var/data:/app/data
