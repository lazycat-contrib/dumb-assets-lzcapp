version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/dumb-assets.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: dumb-assets
build:
  run_buildscript: false
images:
  - id: dumb-assets
    target: service
    service: dumb-assets
    source: dumbwareio/dumbassets
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat
stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: DumbAssets
    summary: "A Stupid Simple Asset Tracker"
